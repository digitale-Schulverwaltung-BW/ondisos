<svg viewBox="0 0 830 424" xmlns="http://www.w3.org/2000/svg" role="img"><title>ondisos Formular im Backend bearbeiten</title><desc>Ein neues Formular beginnt mit einer Vorlage, ein bestehendes mit „Survey bearbeiten“. Im Survey-Editor bearbeiten die Reiter Grafisch und JSON denselben Text; die Live-Vorschau zeigt Änderungen ohne Speichern. Danach: Prüfen, Entwurf speichern, Vorschau, Veröffentlichen. Jede Veröffentlichung landet im Verlauf; Frontend und WordPress zeigen die veröffentlichte Fassung.</desc><defs><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#7F77DD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aps" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#7F77DD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="20" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="185.0" y="45.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Neues Formular anlegen</text><text x="185.0" y="62.0" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Formulare · Schlüssel · Vorlage wählen</text><rect x="370" y="20" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="515.0" y="45.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Bestehendes Formular</text><text x="515.0" y="62.0" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Formulare · Survey bearbeiten</text><path d="M185 76 L185 118" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><path d="M515 76 L515 118" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><rect x="40" y="120" width="620" height="96" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="350.0" y="173.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"></text><text x="60" y="144" font-size="14" font-weight="500" fill="#3C3489" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Survey-Editor</text><rect x="110" y="156" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text x="195.0" y="182.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Grafisch</text><rect x="420" y="156" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text x="505.0" y="182.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">JSON</text><path d="M284 177 L416 177" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)" marker-start="url(#aps)"/><text x="350" y="170" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">derselbe Text</text><rect x="690" y="138" width="120" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="6 4"/><text x="750.0" y="165.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Live-Vorschau</text><text x="750.0" y="182.0" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">ohne Speichern</text><path d="M660 168 L686 168" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/><rect x="40" y="260" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="110.0" y="285.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Prüfen</text><text x="110.0" y="302.0" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Fehler und Hinweise</text><rect x="200" y="260" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="270.0" y="285.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Entwurf speichern</text><text x="270.0" y="302.0" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">noch nicht sichtbar</text><rect x="360" y="260" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="430.0" y="285.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Vorschau</text><text x="430.0" y="302.0" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">wie Besucher es sehen</text><rect x="520" y="260" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="590.0" y="285.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Veröffentlichen</text><text x="590.0" y="302.0" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Version, Anmerkung</text><path d="M180 288 L196 288" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><path d="M340 288 L356 288" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><path d="M500 288 L516 288" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><path d="M110 216 L110 256" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><rect x="690" y="260" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="6 4"/><text x="750.0" y="285.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Verlauf</text><text x="750.0" y="302.0" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">wiederherstellen</text><path d="M660 288 L686 288" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/><path d="M590 316 L590 356" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><rect x="40" y="360" width="620" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="350.0" y="387.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Frontend / WordPress zeigt die veröffentlichte Fassung</text></svg>
