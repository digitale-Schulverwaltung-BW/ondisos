<svg viewBox="0 0 780 580" xmlns="http://www.w3.org/2000/svg" role="img"><title>ondisos Ablauf einer Anmeldung</title><desc>Besucher laden das Formular über das Frontend, das Konfiguration und Survey vom Backend holt. Beim Absenden übergibt das Frontend die Anmeldung signiert an das Backend, das sie speichert und einen PDF-Link zurückgibt. Das PDF holt das Frontend per Token vom Backend.</desc><defs><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#7F77DD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="30" y="20" width="120" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="90.0" y="45.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Besucher</text><path d="M90 60 L90 556" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/><rect x="240" y="20" width="120" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="300.0" y="45.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Frontend</text><path d="M300 60 L300 556" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/><rect x="460" y="20" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="520.0" y="45.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Backend</text><path d="M520 60 L520 556" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/><rect x="640" y="20" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="700.0" y="45.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Datenbank</text><path d="M700 60 L700 556" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/><path d="M92 100 L298 100" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><circle cx="107" cy="84" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="107" y="88" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">1</text><text x="122" y="88" font-size="12" font-weight="400" fill="#222" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Formular aufrufen</text><path d="M302 150 L518 150" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><circle cx="317" cy="134" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="317" y="138" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">2</text><text x="332" y="138" font-size="12" font-weight="400" fill="#222" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Konfiguration und Survey holen (ETag, Cache)</text><text x="332" y="165" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">GET /api/form-config.php?with=survey</text><path d="M518 208 L302 208" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/><circle cx="317" cy="192" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="317" y="196" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">3</text><text x="332" y="196" font-size="12" font-weight="400" fill="#222" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Konfiguration, veröffentlichte Survey</text><path d="M298 250 L92 250" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/><circle cx="107" cy="234" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="107" y="238" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">4</text><text x="122" y="238" font-size="12" font-weight="400" fill="#222" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Formular anzeigen</text><path d="M92 304 L298 304" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><circle cx="107" cy="288" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="107" y="292" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">5</text><text x="122" y="292" font-size="12" font-weight="400" fill="#222" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Anmeldung absenden</text><path d="M302 356 L518 356" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><circle cx="317" cy="340" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="317" y="344" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">6</text><text x="332" y="344" font-size="12" font-weight="400" fill="#222" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Anmeldung übergeben, HMAC-signiert</text><text x="332" y="371" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">POST /api/submit.php?tenant=&lt;slug&gt;</text><path d="M522 414 L698 414" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><circle cx="537" cy="398" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="537" y="402" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">7</text><text x="552" y="402" font-size="12" font-weight="400" fill="#222" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">speichern, PDF-Token erzeugen</text><path d="M518 458 L302 458" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/><circle cx="317" cy="442" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="317" y="446" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">8</text><text x="332" y="446" font-size="12" font-weight="400" fill="#222" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">ID und PDF-Link</text><path d="M298 498 L92 498" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/><circle cx="107" cy="482" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="107" y="486" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">9</text><text x="122" y="486" font-size="12" font-weight="400" fill="#222" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Bestätigung; E-Mail an die Schule</text><path d="M92 538 L298 538" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><circle cx="107" cy="522" r="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="107" y="526" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">10</text><text x="122" y="526" font-size="12" font-weight="400" fill="#222" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">PDF laden (Frontend holt es vom Backend per Token)</text></svg>