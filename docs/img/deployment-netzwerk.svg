<svg viewBox="0 0 780 490" xmlns="http://www.w3.org/2000/svg" role="img"><title>ondisos Netzwerk und Reverse-Proxy</title><desc>Besucher rufen die Schulwebsite (Frontend) auf; das Frontend ruft das Backend serverseitig über einen Reverse-Proxy auf, der nur die API-Pfade durchlässt. Die Verwaltungsoberfläche ist nur im Intranet erreichbar.</desc><defs><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#7F77DD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="24" width="230" height="410" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.7"/><text x="40" y="52" font-size="14" font-weight="500" fill="#444441" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Internet</text><text x="40" y="70" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Schulwebsite (Schul-IT)</text><rect x="290" y="24" width="170" height="410" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.7"/><text x="310" y="52" font-size="14" font-weight="500" fill="#444441" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Netzgrenze</text><text x="310" y="70" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Betreiber</text><rect x="500" y="24" width="260" height="410" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.7"/><text x="520" y="52" font-size="14" font-weight="500" fill="#444441" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Intranet</text><text x="520" y="70" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Schulträger / Medienzentrum</text><rect x="40" y="92" width="190" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="135.0" y="114.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Besucher</text><text x="135.0" y="132.0" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Eltern, Betriebe (Browser)</text><rect x="40" y="250" width="190" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="135.0" y="277.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Frontend</text><text x="135.0" y="295.0" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">WordPress-Plugin</text><text x="135.0" y="313.0" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">oder Standalone-PHP</text><path d="M135 144 L135 250" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><text x="145" y="202" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">HTTPS</text><rect x="305" y="235" width="140" height="110" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="375.0" y="268.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Reverse-Proxy</text><text x="375.0" y="286.0" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">TLS beenden</text><text x="375.0" y="304.0" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">nur /api/* und</text><text x="375.0" y="322.0" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">/pdf/download.php</text><path d="M230 290 L305 290" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><text x="268" y="276" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">HTTPS</text><text x="268" y="312" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">signiert</text><rect x="520" y="92" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text x="635.0" y="114.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Sekretariat, Schul-Admins</text><text x="635.0" y="132.0" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Browser im Schulnetz oder per VPN</text><rect x="520" y="186" width="230" height="232" rx="12" fill="#FFFFFF" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/><text x="535" y="208" font-size="14" font-weight="500" fill="#3C3489" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Backend (Docker)</text><rect x="535" y="222" width="200" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="635.0" y="245.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Verwaltungsoberfläche</text><rect x="535" y="268" width="200" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="635.0" y="291.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">API</text><rect x="535" y="314" width="200" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="635.0" y="337.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">MySQL / MariaDB</text><rect x="535" y="360" width="200" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="635.0" y="383.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">ClamAV (optional)</text><path d="M635 144 L635 222" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><text x="645" y="172" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Intranet / VPN</text><path d="M445 286 L535 286" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ap)"/><text x="480" y="276" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">HTTP</text><path d="M230 118 L400 118" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M394 108 L416 128 M416 108 L394 128" stroke="#A32D2D" stroke-width="2.4" stroke-linecap="round"/><text x="305" y="100" font-size="12" font-weight="500" fill="#A32D2D" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Oberfläche und Login:</text><text x="305" y="150" font-size="12" font-weight="500" fill="#A32D2D" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">von außen gesperrt</text><text x="390" y="468" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Das Frontend ruft das Backend serverseitig auf, nie aus dem Browser der Besucher.</text></svg>