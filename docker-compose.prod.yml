# ============================================================================
# Production Override for docker-compose.yml
# ============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides the base docker-compose.yml with production settings:
# - Production environment variables
# - Secrets from .env file
# - Resource limits
# - Health checks
# - MySQL localhost-only access
# - No frontend container (frontend runs on Apache/Nginx)
# ============================================================================

services:
  # ============================================================================
  # Backend (Production)
  # ============================================================================
  backend:
    container_name: ondisos-backend-prod
    restart: unless-stopped
    # Behind a reverse proxy on the same host set BACKEND_BIND=127.0.0.1 in the root .env, so that only the proxy
    # reaches the backend. `!override` replaces the "9080:80" of docker-compose.yml (Compose >= 2.24).
    ports: !override
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-9080}:80"
    env_file:
      # Optional: Backend-specific overrides (rate limits, virus scan, etc.).
      # Core credentials (DB_USER, DB_PASS) come from root .env.
      # `required: false` needs Docker Compose >= 2.24; without it a missing file aborts `up`.
      - path: ./backend/.env
        required: false
    environment:
      # Override with production values
      - APP_ENV=production
      - APP_DEBUG=false
      # Both default to false until a reverse proxy with SSL is in place. Then set SESSION_SECURE=true
      # (cookies only over HTTPS) and, if the proxy sends X-Forwarded-Proto, FORCE_HTTPS=true in the root .env.
      - SESSION_SECURE=${SESSION_SECURE:-false}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
      - AUTH_ENABLED=true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # MySQL (Production)
  # ============================================================================
  mysql:
    container_name: ondisos-mysql-prod
    restart: unless-stopped
    # No host port exposure needed - backend talks to mysql via internal Docker network.
    # For admin access use: docker compose exec mysql mysql -u anmeldung -p anmeldung
    # Credentials loaded from root .env (via docker-compose.yml variable substitution)
    # `!override` replaces the "3306:3306" of docker-compose.yml (plain `ports:` lists are appended
    # when files are merged). Needs Docker Compose >= 2.24, like the optional backend/.env above.
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ============================================================================
  # Frontend (Disabled in Production)
  # ============================================================================
  # Frontend typically runs on Apache/Nginx in production
  # Uncomment if you want to run frontend in Docker too
  # frontend:
  #   container_name: ondisos-frontend-prod
  #   restart: unless-stopped
  #   env_file:
  #     - ./frontend/.env

  # ============================================================================
  # PHPMyAdmin (Disabled in Production)
  # ============================================================================
  # Never run PHPMyAdmin in production!
  # Access via: docker-compose --profile dev up phpmyadmin
