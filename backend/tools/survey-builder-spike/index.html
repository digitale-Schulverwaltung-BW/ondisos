<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey-Builder: AP0-Durchstich</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; max-width: 1200px; margin-inline: auto; color: #1f2328; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { margin: 0 0 12px; color: #57606a; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  textarea { width: 100%; min-height: 60vh; font: 12px/1.4 ui-monospace, monospace; box-sizing: border-box; }
  ul { list-style: none; padding-left: 18px; margin: 4px 0; }
  .page { font-weight: 600; margin-top: 10px; }
  .el { margin: 3px 0; display: flex; gap: 6px; align-items: baseline; }
  .el .type { color: #57606a; font-size: 12px; min-width: 84px; }
  .el input { flex: 1; min-width: 0; padding: 2px 6px; }
  #status { padding: 8px 10px; border-radius: 6px; background: #ddf4ff; margin-bottom: 8px; }
  #status.error { background: #ffebe9; }
  #warn { color: #9a6700; margin: 4px 0; }
  @media (prefers-color-scheme: dark) { body { background: #0d1117; color: #e6edf3; } #status { background: #0c2d4a; } #status.error { background: #4c1d1d; } textarea, input, select, button { background: #161b22; color: inherit; border: 1px solid #30363d; } }
</style>
</head>
<body>
<h1>Survey-Builder: AP0-Durchstich</h1>
<p class="hint">Entwicklungsseite, nicht Teil des Produkts (PLAN-3.2.0, AP0). Laden, Seiten und Fragen anzeigen, Titel ändern, Text zurückschreiben. Starten: <code>python3 -m http.server</code> im Repository-Stamm, dann <code>/backend/tools/survey-builder-spike/</code> öffnen.</p>
<div class="bar">
  <label>Survey laden: <select id="pick"></select></label>
  <span id="size"></span>
</div>
<div id="status">Noch nichts geladen.</div>
<div id="warn"></div>
<div class="cols">
  <div><div id="tree"></div></div>
  <div><label for="text">Survey-Text (einzige Wahrheit; hier direkt änderbar)</label><textarea id="text" spellcheck="false"></textarea></div>
</div>
<script type="module" src="spike.js"></script>
</body>
</html>
